name: Release all desktop platforms
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Verify every platform before publishing
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 packaging/verify-release.py dist "$RELEASE_TAG"
          cd dist
          cat *.sha256 > checksums.txt
          sha256sum -c checksums.txt
      - uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: FreeTurn Desktop ${{ inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES_DESKTOP.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
