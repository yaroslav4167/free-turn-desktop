name: Native desktop builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config
      - name: Build Linux archive
        env:
          VERSION: ${{ inputs.tag || 'v3.0.0' }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          sh packaging/linux/build-desktop.sh
          mv dist/FreeTurn-Linux-amd64.tar.gz "dist/FreeTurn-Linux-amd64-${VERSION}.tar.gz"
          rm dist/FreeTurn-Linux-amd64.tar.gz.sha256
          cd dist
          sha256sum "FreeTurn-Linux-amd64-${VERSION}.tar.gz" > "FreeTurn-Linux-amd64-${VERSION}.tar.gz.sha256"
      - run: npm --prefix desktop/frontend test
      - run: go test -race -tags webkit2_41 ./internal/... ./mobile ./desktop/...
      - run: go vet -tags webkit2_41 ./internal/session ./mobile ./desktop/...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-linux-amd64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Build Windows archive
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v3.0.0' }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: ./packaging/windows/build-desktop.ps1
      - run: npm --prefix desktop/frontend test
      - run: go test -race ./internal/... ./mobile ./desktop/...
      - run: go vet ./internal/session ./mobile ./desktop/...
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Build macOS archive
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ inputs.tag || 'v3.0.0' }}
          UPDATE_REPOSITORY: ${{ github.repository }}
        run: sh packaging/macos/build-desktop.sh
      - run: npm --prefix desktop/frontend test
      - run: go test -race ./internal/... ./mobile ./desktop/...
      - name: Exercise utun routes and persistent helper
        run: |
          go test -c ./desktop/backend/wintunnel -o "$RUNNER_TEMP/wintunnel.test"
          sudo -n env FREETURN_PRIVILEGED_TESTS=1 "$RUNNER_TEMP/wintunnel.test" -test.run '^TestMacPrivilegedScopedRouting$' -test.v -test.timeout 45s
          go build -o "$RUNNER_TEMP/freeturn-vpn-helper" ./cmd/macos-vpn-helper
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/freeturn-vpn-helper"
          sudo -n env FREETURN_PRIVILEGED_TESTS=1 FREETURN_TEST_SERVICE_UID="$(id -u)" FREETURN_TEST_HELPER_BINARY="$RUNNER_TEMP/freeturn-vpn-helper" "$RUNNER_TEMP/wintunnel.test" -test.run '^TestMacPrivilegedPersistentService$' -test.v -test.timeout 90s
      - name: Validate app archive
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v3.0.0' }}
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          export FREETURN_TEST_MACOS_ARCHIVE="$PWD/dist/FreeTurn-macOS-${MACOS_ARCH}-${RELEASE_TAG}.zip"
          export FREETURN_TEST_MACOS_VERSION="$RELEASE_TAG"
          go test ./desktop/updates -run '^TestMacPackagedArchive$' -v -count=1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
